<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBM Logistics — PT Ridho Bangun Mandiri | Freight Forwarding &amp; Logistics</title>
<meta name="description" content="RBM Logistics (PT Ridho Bangun Mandiri) — reliable sea, air, and land freight forwarding for import, export and domestic cargo in Indonesia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
/* ============ DARK THEME TOKENS ============ */
:root{
  --navy-950:#040c16;
  --navy-900:#081726;
  --navy-800:#0f2238;
  --navy-700:#18324e;
  --orange:#f5811f;
  --orange-dark:#d96a10;
  --teal:#12b5cb;
  --teal-light:rgba(18,181,203,0.12);
  --bg:#060f1a;
  --paper:#0a1a2c;
  --paper-card:#0e2238;
  --ink:#e6f0fa;
  --muted:#8ba2b8;
  --line:#1c344d;
  --line-strong:#2a4a6c;
  --success:#22c55e;
  --radius:10px;
  --radius-sm:6px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 6px 18px rgba(0,0,0,.5);
  --shadow-lg:0 14px 36px rgba(0,0,0,.6);
  --maxw:1220px;
  --font-display:"Archivo",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.1;letter-spacing:-0.01em;}
p{margin:0;}
ul{margin:0;padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper-card);border:1px solid var(--line-strong);}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:11.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--orange);
}
.eyebrow::before{content:"";width:14px;height:2px;background:var(--orange);border-radius:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}

/* ============ HEADER ============ */
.site-header{
  position:sticky;top:0;z-index:200;
  background:rgba(8,23,38,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand img{height:36px;width:auto;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-text .name{font-family:var(--font-display);font-weight:800;font-size:17px;color:#fff;letter-spacing:-.01em;}
.brand-text .name span{color:var(--orange);}
.brand-text .sub{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;}
.main-nav{display:flex;align-items:center;gap:2px;}
.main-nav button{
  background:none;border:none;padding:8px 10px;
  font-weight:700;font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);
  position:relative;transition:color .15s;display:inline-flex;align-items:center;gap:4px;
}
.main-nav button:hover{color:var(--orange);}
.main-nav button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-10px;height:2px;background:var(--orange);border-radius:2px;}
.main-nav button.active{color:var(--orange);}

.nav-cta{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;
  border:1.5px solid transparent;transition:transform .15s, box-shadow .15s, background .15s, border-color .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 4px 12px rgba(245,129,31,.3);}
.btn-primary:hover{background:var(--orange-dark);box-shadow:0 6px 16px rgba(245,129,31,.4);}
.btn-outline{background:transparent;border-color:var(--line-strong);color:var(--ink);}
.btn-outline:hover{background:var(--navy-800);color:#fff;}
.btn-ghost{background:var(--teal-light);color:var(--teal);}
.btn-ghost:hover{background:var(--teal);color:#fff;}
.btn-wa{width:36px;height:36px;padding:0;border-radius:999px;background:var(--paper-card);border:1.5px solid var(--line-strong);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;}
.btn-wa:hover{background:var(--teal);color:#fff;border-color:var(--teal);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 8px;font-size:11px;}
.btn-square{border-radius:5px;text-transform:uppercase;letter-spacing:.02em;}
.btn-block{width:100%;}
.btn-navy{background:var(--navy-700);color:#fff;}
.btn-navy:hover{background:var(--navy-800);}
.btn-ghost-light{background:transparent;border-color:rgba(255,255,255,.3);color:#fff;}
.btn-ghost-light:hover{background:rgba(255,255,255,.1);color:#fff;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.menu-toggle{display:none;background:none;border:1.5px solid var(--line-strong);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;color:#fff;}

/* ============ HOME LAYOUT ============ */
.wrap-wide{max-width:1380px;margin:0 auto;padding:0 24px;}
.home-shell{position:relative;isolation:isolate;overflow:hidden;background:var(--bg);}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start;}
#homeQuote,#about-section,#cargo-section,#contact,#rates-section{scroll-margin-top:80px;}

/* ============ HERO ============ */
.hero{
  position:relative;color:#fff;padding:32px 0 24px;min-height:300px;
  display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;align-items:center;
}
.hero::before{
  content:"";position:absolute;top:0;bottom:0;left:-50vw;right:-50vw;z-index:-1;
  background:
    linear-gradient(90deg,rgba(4,12,22,.96) 0%,rgba(4,12,22,.88) 38%,rgba(4,12,22,.65) 72%,rgba(4,12,22,.85) 100%),
    url("https://raw.githubusercontent.com/kamalovelocidad/rbm-logistik/refs/heads/main/hero-port.jpg") 60% 45%/cover no-repeat,
    var(--navy-950);
}
.hero h1{
  font-size:clamp(30px,3.8vw,52px);font-weight:900;line-height:1;
  text-transform:uppercase;letter-spacing:-.01em;
}
.hero h1 .accent{color:var(--orange);display:block;}
.hero p.lead{margin-top:12px;font-size:15px;color:#c9d8e6;max-width:420px;}
.hero-modes{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:18px;}
.hero-modes li{display:flex;align-items:center;gap:7px;}
.hero-modes svg{width:22px;height:22px;color:#fff;flex-shrink:0;}
.hero-modes span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;max-width:90px;line-height:1.2;}
.hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.hero-track{
  background:var(--paper-card);color:var(--ink);border-radius:8px;padding:16px 16px;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);
}
.hero-track h3{font-size:14px;font-weight:800;text-transform:uppercase;color:#fff;}
.hero-track label{font-size:11px;color:var(--muted);}
.hero-track input{
  padding:8px 10px;border-radius:5px;border:1px solid var(--line-strong);font-size:12.5px;
  font-family:var(--font-mono);width:100%;background:var(--paper);color:#fff;
}
.hero-track input::placeholder{font-family:var(--font-body);color:var(--muted);}
.hero-track input:focus{border-color:var(--orange);}
.hero-track .btn{justify-content:space-between;margin-top:2px;}
.hero-track p{font-size:11px;color:var(--muted);}

/* ============ HOME SERVICES ============ */
.home-services{padding:16px 0 20px;}
.home-section-head{text-align:center;}
.home-section-head .kicker{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--orange);}
.home-section-head h2{font-size:clamp(18px,1.8vw,24px);font-weight:700;color:#fff;margin-top:4px;}
.svc-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:14px;}
.svc-tile{
  background:var(--paper-card);border:1px solid var(--line);border-radius:6px;padding:14px 10px 12px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  transition:transform .15s, box-shadow .15s;
}
.svc-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--orange);}
.svc-icon{color:var(--teal);}
.svc-icon svg{width:28px;height:28px;}
.svc-tile h3{font-size:12px;font-weight:800;text-transform:uppercase;color:#fff;margin-top:2px;}
.svc-tile p{font-size:11.5px;color:var(--muted);line-height:1.3;}
.svc-tile .link-more{margin-top:auto;padding-top:4px;font-weight:700;font-size:11.5px;color:var(--orange);display:inline-flex;align-items:center;gap:4px;}
.svc-tile .link-more svg{width:11px;height:11px;transition:transform .15s;}
.svc-tile:hover .link-more svg{transform:translateX(2px);}

/* ============ INFO BAND ============ */
.info-band{position:relative;display:grid;grid-template-columns:1fr 1fr 1.3fr;padding:16px 0 20px;}
.info-band::before{content:"";position:absolute;top:0;bottom:0;left:-50vw;right:-50vw;z-index:-1;background:var(--paper);}
.info-col{padding:0 16px;border-right:1px solid var(--line);}
.info-col:first-child{padding-left:0;}
.info-col:last-child{border-right:none;padding-right:0;}
.info-col h4{font-size:12px;font-weight:800;text-transform:uppercase;color:#fff;margin-bottom:10px;}
.cargo-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;}
.cargo-list li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);}
.cargo-list svg{width:15px;height:15px;color:var(--teal);flex-shrink:0;}
.why-list{display:flex;flex-direction:column;gap:5px;}
.why-list li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink);}
.why-list svg{width:14px;height:14px;color:var(--orange);flex-shrink:0;}
.band-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);}
.band-stats b{display:block;font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--orange);}
.band-stats span{font-size:11px;color:var(--muted);line-height:1.2;display:block;max-width:80px;}
.industry-icons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.industry-icon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:10.5px;color:var(--ink);line-height:1.2;}
.industry-icon svg{width:20px;height:20px;color:var(--teal);}

/* ============ HOME QUOTE PANEL ============ */
.home-quote{position:relative;z-index:2;margin-top:28px;margin-bottom:20px;}
.quote-panel{background:var(--paper-card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-lg);padding:18px 16px;}
.quote-panel > h3{font-size:15px;font-weight:800;text-transform:uppercase;color:#fff;padding-bottom:8px;margin-bottom:12px;position:relative;}
.quote-panel > h3::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:2px;background:var(--orange);}
.compact-form .form-grid{gap:8px;}
.compact-form .field{gap:3px;}
.compact-form .field label{font-size:11px;color:var(--ink);}
.compact-form .field input,.compact-form .field select,.compact-form .field textarea{padding:7px 8px;font-size:12px;border-radius:4px;border-width:1px;background:var(--paper);color:#fff;border-color:var(--line-strong);}
.compact-form .field textarea{min-height:50px;}
.compact-form .field-row3{gap:6px;}
.compact-form .btn-block{margin-top:12px;justify-content:center;}
.lock-note{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:10.5px;color:var(--muted);}
.lock-note svg{flex-shrink:0;}

/* ============ SECTION SHELL ============ */
.section{padding:48px 0;}
.section-tight{padding:36px 0;}
.section-head{max-width:540px;margin-bottom:28px;}
.section-head h2{font-size:clamp(20px,2.4vw,28px);font-weight:800;margin-top:8px;color:#fff;}
.section-head p{margin-top:8px;color:var(--muted);font-size:14.5px;}
.section-alt{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.center{text-align:center;margin-left:auto;margin-right:auto;}

/* ============ ICON TILE ============ */
.icon-tile{
  width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--teal-light);color:var(--teal);flex-shrink:0;
}
.icon-tile svg{width:22px;height:22px;}

/* ============ CTA BANNER ============ */
.cta-banner{
  background:linear-gradient(120deg,var(--navy-800) 0%,var(--paper-card) 100%);
  border:1px solid var(--line-strong);
  border-radius:12px;padding:28px 28px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;color:#fff;flex-wrap:wrap;
}
.cta-banner h3{font-size:20px;font-weight:800;}
.cta-banner p{margin-top:4px;color:var(--muted);font-size:13.5px;}
.cta-banner .btn-primary{background:var(--orange);color:#fff;box-shadow:none;}
.cta-banner .btn-primary:hover{background:var(--orange-dark);color:#fff;}

/* ============ PAGE HEADER ============ */
.page-hero{
  background:linear-gradient(120deg,var(--navy-950),var(--paper));
  border-bottom:1px solid var(--line);
  color:#fff;padding:36px 0 28px;
}
.page-hero h1{font-size:clamp(24px,3vw,34px);font-weight:900;margin-top:8px;}
.page-hero p{margin-top:8px;color:var(--muted);max-width:520px;font-size:14.5px;}
.breadcrumb{font-size:12px;color:var(--muted);font-weight:600;}
.breadcrumb b{color:#fff;}

/* ============ SERVICES PAGE ============ */
.svc-grid-full{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.svc-full-card{
  background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;
  display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
}
.svc-full-card .num{position:absolute;top:14px;right:16px;font-family:var(--font-mono);font-size:11px;color:var(--line-strong);font-weight:700;}
.svc-full-card h3{font-size:16.5px;color:#fff;}
.svc-full-card .pitch{font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--orange);}
.svc-full-card p.desc{color:var(--muted);font-size:13px;}
.svc-full-card .feat{display:flex;flex-direction:column;gap:6px
